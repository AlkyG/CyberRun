<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Run pro Meu Amor 🌌✨</title>
    <style>
        body {
            background-color: #05010a;
            background-image: linear-gradient(to bottom, #140526, #05010a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: #fff;
            touch-action: none;
        }

        h2 {
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            color: #fff;
            margin: 0 0 10px 0;
            font-size: 20px;
            text-align: center;
        }

        #gameCanvas {
            border: 3px solid #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background-color: rgba(10, 2, 20, 0.9);
        }

        /* Painel de Mensagem Dinâmica */
        #painel-mensagem {
            width: 320px;
            min-height: 50px;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-weight: bold;
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
        }

        #painel-fim {
            display: none;
            position: absolute;
            background: rgba(5, 1, 10, 0.95);
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            z-index: 20;
            width: 280px;
        }

        button {
            background: linear-gradient(45deg, #00ffff, #bc13fe);
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffff;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Arraste para mover e destruir os alvos! 🚀</h2>
    <canvas id="gameCanvas" width="320" height="420"></canvas>
    <div id="painel-mensagem">Destrua um alvo para liberar uma mensagem... ✨</div>

    <div id="painel-fim">
        <div id="texto-fim" style="font-size: 18px; line-height: 1.5;"></div>
        <button onclick="reiniciarJogo()">Jogar de Novo 🚀</button>
    </div>

    <script>
        // ==========================================
        //  VEJA AQUI: ESPAÇO PARA EDITAR AS FRASES
        // ==========================================
        // Adicione ou mude as mensagens abaixo. Cada alvo destruído libera a próxima frase!
        const frasesAmor = [
            "gostosa, rabuda e amor da minja vidaaaa! 💖",
            "Você brilha mais que o neon desse jogo. 🌌",
            "Cada segundo contigo é um combo de felicidade. ⚡",
            "Minha parceria ideal para qualquer missão. 🔮",
            "Você zerou o jogo do meu coração! Te amo demais! ❤️"
        ];

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const painelMensagem = document.getElementById("painel-mensagem");
        const painelFim = document.getElementById("painel-fim");
        const textoFim = document.getElementById("texto-fim");

        // Configurações do jogador (Nave Cyberpunk)
        let player = { x: 145, y: 370, largura: 30, altura: 25, velocidade: 7 };
        let tiros = [];
        let alvos = [];
        let scoreFrase = 0;
        let gameOver = false;
        let loopId;
        let frameContador = 0;

        // Iniciar
        function iniciarJogo() {
            tiros = [];
            alvos = [];
            scoreFrase = 0;
            gameOver = false;
            frameContador = 0;
            player.x = canvas.width / 2 - player.largura / 2;
            painelFim.style.display = "none";
            painelMensagem.innerHTML = "Destrua um alvo para liberar uma mensagem... ✨";
            
            cancelAnimationFrame(loopId);
            loopId = requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameContador++;

            // Desenhar linhas da pista Cyberpunk para dar efeito de corrida/movimento
            ctx.strokeStyle = "rgba(188, 19, 254, 0.2)";
            ctx.lineWidth = 2;
            let deslocamentoLinha = (frameContador % 20);
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i + deslocamentoLinha);
                ctx.lineTo(canvas.width, i + deslocamentoLinha);
                ctx.stroke();
            }

            // Criar novos alvos andantes (Corações ou Cristais) de tempos em tempos
            if (frameContador % 45 === 0) {
                let xAleatorio = Math.random() * (canvas.width - 25);
                // Inverte direções para fazê-los andar em zigue-zague
                let direcaoX = Math.random() > 0.5 ? 1 : -1;
                alvos.push({ x: xAleatorio, y: -20, raio: 12, velY: 2.5, velX: direcaoX * 1.5 });
            }

            // Atirar automaticamente
            if (frameContador % 12 === 0) {
                tiros.push({ x: player.x + player.largura / 2, y: player.y, raio: 3, velY: -6 });
            }

            // Atualizar e desenhar Tiros
            ctx.fillStyle = "#00ffff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffff";
            for (let i = tiros.length - 1; i >= 0; i--) {
                tiros[i].y += tiros[i].velY;
                ctx.beginPath();
                ctx.arc(tiros[i].x, tiros[i].y, tiros[i].raio, 0, Math.PI * 2);
                ctx.fill();

                if (tiros[i].y < 0) tiros.splice(i, 1);
            }

            // Atualizar e desenhar Alvos Andantes
            for (let i = alvos.length - 1; i >= 0; i--) {
                alvos[i].y += alvos[i].velY;
                alvos[i].x += alvos[i].velX;

                // Rebater nas paredes laterais (Efeito zigue-zague)
                if (alvos[i].x - alvos[i].raio < 0 || alvos[i].x + alvos[i].raio > canvas.width) {
                    alvos[i].velX *= -1;
                }

                // Desenha o alvo (Coração Neon)
                ctx.fillStyle = "#ff007f";
                ctx.shadowColor = "#ff007f";
                ctx.shadowBlur = 12;
                ctx.font = "18px Arial";
                ctx.fillText("❤️", alvos[i].x - 9, alvos[i].y + 6);

                // Verificar colisão com o jogador (Game Over se tocar na nave)
                let distPlayer = Math.hypot((alvos[i].x - (player.x + player.largura/2)), (alvos[i].y - player.y));
                if (distPlayer < alvos[i].raio + 12) {
                    terminarJogo(false);
                    return;
                }

                // Verificar se o tiro acertou o alvo
                for (let j = tiros.length - 1; j >= 0; j--) {
                    let distTiro = Math.hypot(tiros[j].x - alvos[i].x, tiros[j].y - alvos[i].y);
                    if (distTiro < tiros[j].raio + alvos[i].raio) {
                        alvos.splice(i, 1);
                        tiros.splice(j, 1);
                        
                        // Atualiza a frase na tela
                        painelMensagem.innerHTML = frasesAmor[scoreFrase % frasesAmor.length];
                        scoreFrase++;

                        // Se ela destruiu o suficiente para ler todas as frases, ela vence!
                        if (scoreFrase >= frasesAmor.length) {
                            terminarJogo(true);
                            return;
                        }
                        break;
                    }
                }

                // Remove se passar da tela por baixo
                if (alvos[i] && alvos[i].y > canvas.height) {
                    alvos.splice(i, 1);
                }
            }

            // Desenhar Jogador (Nave Triângulo Neon)
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#00ffff";
            ctx.shadowColor = "#00ffff";
            ctx.shadowBlur = 15;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x + player.largura / 2, player.y);
            ctx.lineTo(player.x, player.y + player.altura);
            ctx.lineTo(player.x + player.largura, player.y + player.altura);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset

            loopId = requestAnimationFrame(gameLoop);
        }

        // --- CONTROLE POR TOQUE (ARRASTAR) ---
        window.addEventListener('touchmove', function(e) {
            let toqueX = e.touches[0].clientX;
            // Pega a posição relativa do canvas na tela
            let rect = canvas.getBoundingClientRect();
            let xRelativo = toqueX - rect.left;
            
            // Centraliza a nave no dedo e impede de sair das bordas
            if (xRelativo >= 0 && xRelativo <= canvas.width) {
                player.x = xRelativo - player.largura / 2;
            }
            e.preventDefault();
        }, { passive: false });

        function terminarJogo(vitoria) {
            gameOver = true;
            cancelAnimationFrame(loopId);
            painelFim.style.display = "block";
            if (vitoria) {
                textoFim.innerHTML = "<span style='color:#00ffff; font-weight:bold; font-size:22px;'>VOCÊ VENCEU! 👑</span><br><br>Você desbloqueou todas as mensagens e provou ser a melhor piloto do mundo! ❤️🛸";
            } else {
                textoFim.innerHTML = "<span style='color:#ff007f; font-weight:bold; font-size:22px;'>GAME OVER 💥</span><br><br>Opa! Um coração colidiu com você. Mas não desiste, tenta de novo para ler tudo! 💜";
            }
        }

        function reiniciarJogo() {
            iniciarJogo();
        }

        // Inicia automaticamente ao abrir
        iniciarJogo();
    </script>
</body>
</html>
