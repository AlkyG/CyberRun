<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Run Infinito pro Meu Amor 🌌✨</title>
    <style>
        body {
            background-color: #05010a;
            background-image: linear-gradient(to bottom, #140526, #05010a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: #fff;
            touch-action: none;
        }

        /* PAINEL MUDOU PARA O TOPO (Fica visível acima do dedo) */
        #painel-mensagem {
            width: 320px;
            min-height: 65px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            font-size: 15px;
            backdrop-filter: blur(5px);
        }

        #gameCanvas {
            border: 3px solid #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
            border-radius: 12px;
            background-color: rgba(10, 2, 20, 0.9);
        }

        #pontuacao {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            color: #bc13fe;
            text-shadow: 0 0 8px #bc13fe;
        }

        #painel-fim {
            display: none;
            position: absolute;
            background: rgba(5, 1, 10, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            z-index: 20;
            width: 280px;
        }

        button {
            background: linear-gradient(45deg, #ff007f, #bc13fe);
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="painel-mensagem">Acerte os alvos para liberar mensagens aleatórias! 🚀✨</div>
    
    <canvas id="gameCanvas" width="320" height="400"></canvas>
    
    <div id="pontuacao">Corações coletados: 0</div>

    <div id="painel-fim">
        <div id="texto-fim" style="font-size: 18px; line-height: 1.5;"></div>
        <button onclick="reiniciarJogo()">Jogar de Novo 🚀</button>
    </div>

    <script>
        // =======================================================
        //  ESPAÇO DAS FRASES: ADICIONE QUANTAS QUISER AQUI EMBAIXO
        // =======================================================
        // O jogo vai sortear essas mensagens de forma totalmente aleatória cada vez que ela destruir um alvo.
        const frasesAmor = [
            "Você brilha mais que o neon desse jogo! 🌌",
            "Cada segundo contigo é um combo de felicidade. ⚡",
            "Gostosa, Rabuda, Amor da minha vidaaaa! 💖",
            "Minha parceria ideal para qualquer missão. 🔮",
            "Sou completamente viciado no seu sorriso e na tua bunda. 😍",
            "O mundo fica muito mais bonito do seu lado! 🌸",
            "Atenção: Você foi rastreada como o amor da minha vida. 🚨",
            "Você é o meu pensamento favorito de todos os dias. ✨",
            "O dengo mais gostoso desse mundo é o seu. 🥰",
            "Saiba que é uma pessoa muito forte!"
            "Respira comigo, 1...2...3...4..."
            "Pega na minha mao e nao solta!!"
            "Vai se engasgagar quando comigo?"
          
        ];

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const painelMensagem = document.getElementById("painel-mensagem");
        const painelFim = document.getElementById("painel-fim");
        const textoFim = document.getElementById("texto-fim");
        const pontuacaoElemento = document.getElementById("pontuacao");

        let player = { x: 145, y: 350, largura: 30, altura: 25 };
        let tiros = [];
        let alvos = [];
        let pontuacao = 0;
        let gameOver = false;
        let loopId;
        let frameContador = 0;

        function iniciarJogo() {
            tiros = [];
            alvos = [];
            pontuacao = 0;
            gameOver = false;
            frameContador = 0;
            player.x = canvas.width / 2 - player.largura / 2;
            painelFim.style.display = "none";
            pontuacaoElemento.innerHTML = "Corações coletados: 0";
            painelMensagem.innerHTML = "Acerte os alvos para liberar mensagens aleatórias! 🚀✨";
            
            cancelAnimationFrame(loopId);
            loopId = requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameContador++;

            // Linhas da pista Cyberpunk (Efeito de velocidade)
            ctx.strokeStyle = "rgba(0, 255, 255, 0.15)";
            ctx.lineWidth = 2;
            let deslocamentoLinha = (frameContador % 20);
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i + deslocamentoLinha);
                ctx.lineTo(canvas.width, i + deslocamentoLinha);
                ctx.stroke();
            }

            // Cria novos alvos em zigue-zague (Fica um pouquinho mais frequente com o tempo)
            let frequenciaAlvos = Math.max(25, 50 - Math.floor(pontuacao / 2));
            if (frameContador % frequenciaAlvos === 0) {
                let xAleatorio = Math.random() * (canvas.width - 25);
                let direcaoX = Math.random() > 0.5 ? 1 : -1;
                // Os alvos descem um pouco mais rápido conforme o score aumenta
                let velocidadeIncialY = 2 + (pontuacao * 0.05); 
                alvos.push({ x: xAleatorio, y: -20, raio: 12, velY: velocidadeIncialY, velX: direcaoX * 1.5 });
            }

            // Tiros automáticos
            if (frameContador % 10 === 0) {
                tiros.push({ x: player.x + player.largura / 2, y: player.y, raio: 3, velY: -7 });
            }

            // Atualiza Tiros
            ctx.fillStyle = "#ff007f";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff007f";
            for (let i = tiros.length - 1; i >= 0; i--) {
                tiros[i].y += tiros[i].velY;
                ctx.beginPath();
                ctx.arc(tiros[i].x, tiros[i].y, tiros[i].raio, 0, Math.PI * 2);
                ctx.fill();

                if (tiros[i].y < 0) tiros.splice(i, 1);
            }

            // Atualiza Alvos
            for (let i = alvos.length - 1; i >= 0; i--) {
                alvos[i].y += alvos[i].velY;
                alvos[i].x += alvos[i].velX;

                // Rebate nas paredes
                if (alvos[i].x - alvos[i].raio < 0 || alvos[i].x + alvos[i].raio > canvas.width) {
                    alvos[i].velX *= -1;
                }

                // Desenha Alvo (Coração Neon)
                ctx.fillStyle = "#00ffff";
                ctx.shadowColor = "#00ffff";
                ctx.shadowBlur = 12;
                ctx.font = "18px Arial";
                ctx.fillText("❤️", alvos[i].x - 9, alvos[i].y + 6);

                // Colisão com o jogador
                let distPlayer = Math.hypot((alvos[i].x - (player.x + player.largura/2)), (alvos[i].y - player.y));
                if (distPlayer < alvos[i].raio + 12) {
                    terminarJogo();
                    return;
                }

                // Colisão Tiro com Alvo
                for (let j = tiros.length - 1; j >= 0; j--) {
                    let distTiro = Math.hypot(tiros[j].x - alvos[i].x, tiros[j].y - alvos[i].y);
                    if (distTiro < tiros[j].raio + alvos[i].raio) {
                        alvos.splice(i, 1);
                        tiros.splice(j, 1);
                        
                        pontuacao++;
                        pontuacaoElemento.innerHTML = "Corações coletados: " + pontuacao;

                        // SORTEIO ALEATÓRIO DA FRASE (Pode repetir conforme ela vai jogando)
                        let indiceAleatorio = Math.floor(Math.random() * frasesAmor.length);
                        painelMensagem.innerHTML = frasesAmor[indiceAleatorio];
                        break;
                    }
                }

                // Remove se sair por baixo
                if (alvos[i] && alvos[i].y > canvas.height) {
                    alvos.splice(i, 1);
                }
            }

            // Desenha Jogador (Nave Neon)
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#ff007f";
            ctx.shadowColor = "#ff007f";
            ctx.shadowBlur = 15;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x + player.largura / 2, player.y);
            ctx.lineTo(player.x, player.y + player.altura);
            ctx.lineTo(player.x + player.largura, player.y + player.altura);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            loopId = requestAnimationFrame(gameLoop);
        }

        // CONTROLE DE TOQUE EMBAIXO
        window.addEventListener('touchmove', function(e) {
            let toqueX = e.touches[0].clientX;
            let rect = canvas.getBoundingClientRect();
            let xRelativo = toqueX - rect.left;
            
            if (xRelativo >= 0 && xRelativo <= canvas.width) {
                player.x = xRelativo - player.largura / 2;
            }
            e.preventDefault();
        }, { passive: false });

        function terminarJogo() {
            gameOver = true;
            cancelAnimationFrame(loopId);
            painelFim.style.display = "block";
            textoFim.innerHTML = "<span style='color:#ff007f; font-weight:bold; font-size:22px;'>FIM DA CORRIDA 💥</span><br><br>Você coletou <span style='color:#00ffff; font-weight:bold;'>" + pontuacao + "</span> corações e leu várias mensagens!<br><br>Quer tentar bater seu recorde? ❤️";
        }

        function reiniciarJogo() {
            iniciarJogo();
        }

        iniciarJogo();
    </script>
</body>
</html>
